services:
  - type: web
    name: rapidlink-microfinance
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SITE_URL
        value: https://rapidlinkgh.com
      # Public Supabase browser configuration. Render prompts for these values
      # when the Blueprint is created or synchronized.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # Only valid client-only routes get an SPA shell. Missing paths must reach
      # Render's native 404 response; do not restore a catch-all 200 rewrite.
      - type: rewrite
        source: /content-management
        destination: /spa.html
      - type: rewrite
        source: /content-management/
        destination: /spa.html
      - type: rewrite
        source: /career-management
        destination: /spa.html
      - type: rewrite
        source: /career-management/
        destination: /spa.html
      - type: rewrite
        source: /accept-invite
        destination: /spa.html
      - type: rewrite
        source: /accept-invite/
        destination: /spa.html
      - type: rewrite
        source: /loan-calculator
        destination: /spa.html
      - type: rewrite
        source: /loan-calculator/
        destination: /spa.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
