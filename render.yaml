services:
  - type: web
    name: rapidlink-microfinance
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SITE_URL
        value: https://rapidlinkgh.com
      # Public Supabase browser configuration. Render prompts for these values
      # when the Blueprint is created or synchronized.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # React Router handles every route that is not a real built asset.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
